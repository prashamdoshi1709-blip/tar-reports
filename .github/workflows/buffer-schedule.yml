name: TAR Buffer Schedule

# Schedules the verified, current-day TAR report in Buffer (official GraphQL API) for 3:00 PM Sydney.
# It runs on GitHub's timezone-aware schedule (Australia/Sydney) at 2:17 PM and 2:24 PM on weekdays and
# acts ONLY on a complete verified handoff reports/<date>-<TICKER>/publish.json (schema 2) that the 1:58 PM
# TAR Auto-Publish routine commits after all research, ASX and clean-PDF checks pass. A PDF without that
# handoff is never published. Buffer is read before every attempt, so the second run cannot duplicate the first.
# Manual runs can only do a Buffer read-only selftest or a no-post dryrun; they can never create a post.
on:
  schedule:
    - cron: '17 14 * * 1-5'
      timezone: 'Australia/Sydney'
    - cron: '24 14 * * 1-5'
      timezone: 'Australia/Sydney'
  workflow_dispatch:
    inputs:
      mode:
        description: 'selftest = Buffer read-only connection test; dryrun = full checks on a payload, no post'
        type: choice
        options: [selftest, dryrun]
        default: selftest
      payload:
        description: 'dryrun only: path like reports/2026-10-19-CGF/publish.json'
        required: false

permissions:
  contents: read

concurrency:
  group: tar-buffer-schedule
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf
      - name: Verify and schedule
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
          PAYLOAD: ${{ github.event_name == 'schedule' && '' || inputs.payload }}
        run: python3 tools/buffer_schedule.py
