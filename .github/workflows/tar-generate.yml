name: TAR Generate

# Automated TAR report generator (tar_gen/). Reads the Vitti Daily Mover package that the existing Gmail -> Apps Script
# import writes to Google Drive, writes the report (MODE B deterministic by default; MODE A Gemini free tier only if authorised), renders the two-page PDF and cover, checks everything and
# writes a schema 4 handoff. It NEVER calls Buffer: in publish mode it commits the report + publish.json to main and the
# existing "TAR Buffer Schedule" workflow (started by workflow_run) re-verifies and publishes it.
#
# Off by default: config/auto-publish.json vitti_generator.enabled=false (scheduled runs exit at once).
# enabled=true + publish=false = SHADOW: reports are built and verified, never committed or posted.
# Publishing additionally needs vitti_generator.publish, vitti_generator.rights_confirmed and the master switch.
#
# Triggers: schedule every 10 min 10:00-14:50 Sydney on weekdays (retries until a report exists), repository_dispatch
# "tar_package_ready" (optional, sent by apps-script/TarDispatch.gs the moment a package lands), and manual runs.
on:
  schedule:
    - cron: '*/10 10-14 * * 1-5'
      timezone: 'Australia/Sydney'
  repository_dispatch:
    types: [tar_package_ready]
  workflow_dispatch:
    inputs:
      mode:
        description: 'check-connections = Drive + optional Gemini key test (synthetic prompt), nothing generated; shadow = private test on the newest real package (even if already published), never publishes or commits; offline-tests = test suite only; run = normal run (publishes only if every switch allows it)'
        type: choice
        options: [check-connections, shadow, offline-tests, run]
        default: check-connections

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: tar-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Is there anything to do?
        id: gate
        run: |
          D=$(TZ=Australia/Sydney date +%F)
          echo "Sydney now: $(TZ=Australia/Sydney date -Iseconds)"
          go=true
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            if ! python3 -c "import json,sys; sys.exit(0 if json.load(open('config/auto-publish.json')).get('vitti_generator',{}).get('enabled') is True else 1)"; then
              echo "generator disabled (config vitti_generator.enabled=false)"; go=false
            elif ls -d reports/$D-* >/dev/null 2>&1; then
              echo "a report for $D already exists"; go=false
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - name: Install tools
        if: steps.gate.outputs.go == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils qpdf libpango-1.0-0 libpangoft2-1.0-0 hunspell hunspell-en-au hunspell-en-us
          python3 -m pip install -q -r tar_gen/requirements.txt
      # No artifacts are uploaded: this repository is public, so report files never leave the runner.
      - name: Offline test suite
        if: steps.gate.outputs.go == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'offline-tests'
        run: python3 tools/test_tar_gen.py
      - name: Generate
        if: steps.gate.outputs.go == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'offline-tests')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'run' }}
        run: |
          case "$MODE_INPUT" in
            check-connections) python3 -m tar_gen.run --check-connections ;;
            # Private test: newest package of the last 10 days, built even if already published; forced shadow mode,
            # no notifications, output deleted. The normal "run" path below keeps every duplicate rule.
            shadow) rc=0; python3 -m tar_gen.run --latest 10 --no-notify --out "$RUNNER_TEMP/tar-shadow" || rc=$?
                    rm -rf "$RUNNER_TEMP/tar-shadow"; exit $rc ;;
            *) python3 -m tar_gen.run ;;
          esac
